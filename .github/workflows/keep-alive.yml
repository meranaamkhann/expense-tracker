name: Keep backend awake

# Render's free tier spins the web service down after ~15 minutes with no traffic, and the next
# real request pays a slow cold-start. This pings /health often enough that Render never sees
# 15 idle minutes. Not needed at all on a paid Render plan (or any host that doesn't sleep) —
# safe to delete this file once you're off the free tier.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then
            echo "BACKEND_URL secret is not set — see the README for how to add it. Skipping."
            exit 0
          fi
          echo "Pinging ${{ secrets.BACKEND_URL }}/health"
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ secrets.BACKEND_URL }}/health")
          echo "Response status: $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Health check returned $status instead of 200"
          fi