spring:
  application:
    name: ExpenseTracker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Kolkata

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.asad.expensetracker: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/expensetracker;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  security:
    jwt:
      # Dev-only fallback secret so `mvn spring-boot:run` works with zero setup.
      # Never used in prod: the prod profile below requires JWT_SECRET to be set explicitly.
      secret: ${JWT_SECRET:dev-only-secret-change-me-please-this-is-not-for-production-use-1234567890}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/expensetracker}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      # NOTE: no Flyway/Liquibase is wired up yet, so we let Hibernate manage the schema.
      # Before a real production launch, swap this for a migration tool and set this to "validate".
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 30

app:
  security:
    jwt:
      secret: ${JWT_SECRET:?Set the JWT_SECRET environment variable to a random 32+ character string in production}
